<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Садовод — причал у берега</title><style>body{margin:0;background:#244d30;color:#fff3db;font:16px system-ui}header{padding:14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:#173c28}button{padding:10px 15px;font:inherit;border-radius:6px;border:1px solid #ae985f;background:#f3e4c1;color:#25432d}svg{display:block;width:100%;height:calc(100dvh - 120px)}footer{padding:12px}</style><header><strong>Деревянный причал</strong><button id="shore">У берега</button><button id="water">В воде</button><button id="land">На суше</button><button id="road">Дорожка и вода</button><button id="rotate">Повернуть</button><button id="effect">Сравнить без воды на сваях</button></header><svg id="world" viewBox="315 88 160 114" aria-label="Причал в настоящем игровом водоёме"></svg><footer>Четыре игровых ракурса · прозрачные части свай под водой · контакт по настоящей береговой маске · сохранение фермы не изменяется</footer><script type="module">
import {TerrainRenderer} from './terrain-svg-renderer.js?v=266';
import {landCells,cellIndex} from './land-model.js?v=182';
import {spriteBox} from './decor-model.js?v=276';
import {updateGrounding,removeGrounding} from './object-grounding.js?v=276';
const svg=document.querySelector('#world'),renderer=new TerrainRenderer(svg),cells=landCells(0),ns='http://www.w3.org/2000/svg',catalog=await fetch('./assets/current-v205/catalog.json?v=268').then(r=>r.json());let group,effect=true,mode='shore',rotation=1;
function draw(){if(group){removeGrounding(group);group.remove()}cells.fill('grass');for(let c=0;c<12;c++)for(let r=0;r<12;r++){if(mode==='water'||(mode==='shore'||mode==='road')&&c>=5)cells[cellIndex(c,r)]='water';else if(mode==='road'&&c>=3)cells[cellIndex(c,r)]='path';}renderer.update(cells);renderer.setView({scale:5});const o={id:'pier-check',type:'shore_3',column:4,row:4,rotation},frame=catalog.shore_3[rotation],box=spriteBox(o,catalog.shore_3);group=document.createElementNS(ns,'g');group.dataset.decorId=o.id;const im=document.createElementNS(ns,'image');im.setAttribute('href',frame.src);for(const k of ['x','y','width','height'])im.setAttribute(k,box[k]);group.append(im);svg.append(group);if(effect)updateGrounding(svg,group,o,im,box,cells,frame)}
document.querySelector('#rotate').onclick=()=>{rotation=(rotation+1)%4;draw()};for(const id of ['shore','water','land','road'])document.querySelector('#'+id).onclick=()=>{mode=id;draw()};document.querySelector('#effect').onclick=e=>{effect=!effect;e.target.textContent=effect?'Сравнить без воды на сваях':'Включить воду на сваях';draw()};draw();
</script></html>

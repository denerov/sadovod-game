  <script type="application/x-sadovod" data-script-type="classic">
    const plot=document.querySelector('.plot');
    const cells=document.createDocumentFragment();
    // Logical square grid projected to diamonds, width:height = 2:1.
    // One shared projection will also position future objects on these cells.
    const rows=12,cols=12,halfWidth=32,halfHeight=16;
    for(let row=0;row<rows;row++)for(let col=0;col<cols;col++){
      const x=(col-row)*halfWidth+rows*halfWidth;
      const y=(col+row)*halfHeight;
      const cell=document.createElementNS('http://www.w3.org/2000/svg','polygon');
      cell.setAttribute('class','cell');
      cell.setAttribute('points',`${x},${y} ${x+halfWidth},${y+halfHeight} ${x},${y+2*halfHeight} ${x-halfWidth},${y+halfHeight}`);
      cell.dataset.row=row;cell.dataset.col=col;
      cell.setAttribute('aria-hidden','true');cells.append(cell);
    }
    plot.append(cells);
  </script>

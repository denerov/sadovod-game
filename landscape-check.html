<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Садовод — проверка ландшафта</title>
<style>*{box-sizing:border-box}body{margin:0;background:#244d30;color:#fff6df;font:15px system-ui}header{padding:14px 20px;background:#153c27;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{font:inherit;padding:9px 15px;border:1px solid #bca46e;background:#f5e7c5;color:#253e27;border-radius:6px;cursor:pointer}svg{display:block;width:100%;height:calc(100vh - 110px)}footer{padding:8px 20px;background:#153c27}#status{margin-left:auto}</style>
<header><strong>Садовод · проверка ландшафта</strong><button id="beds-close">Грядки крупно</button><button id="bank-close">Берег крупно</button><button id="overview">Общий вид</button><button id="bank">Дорожка у воды</button><button id="rotate">Повернуть дерево</button><button id="rotate-built">Повернуть дом и мост</button><button id="move">Переместить дерево</button><button id="remove">Убрать куст</button><button id="reset">Вернуть</button><span id="status">Загрузка…</span></header>
<svg id="world" viewBox="120 0 540 370" aria-label="Предметы, грядки и дорожка вплотную к воде"></svg><footer>Дорожка у воды · грядки · трава у оснований</footer>
<style>#plants-close{border-color:#79a45b}</style>
<script type="module">
import {TerrainRenderer} from './terrain-svg-renderer.js?v=266';
import {updateGrounding,removeGrounding} from './object-grounding.js?v=269';
import {spriteBox,spriteTransform} from './decor-model.js?v=268';
import {landCells,cellIndex,cellColumn,cellRow} from './land-model.js?v=182';
import {roundedBed} from './terrain-details.js?v=258';
import {bedEdgeNodes} from './bed-surface.js?v=258';
import {PaintedTurfEdge} from './painted-turf-edge.js?v=262';
import {bedCoverage} from './terrain-boundaries.js?v=258';
import {bridgeJoins} from './bridge-model.js?v=203';
const svg=document.querySelector('#world'),renderer=new TerrainRenderer(svg),status=document.querySelector('#status'),NS='http://www.w3.org/2000/svg',make=(tag,attrs={})=>{const n=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);return n};
const plantsButton=document.createElement('button');plantsButton.id='plants-close';plantsButton.textContent='Дерево и куст крупно';document.querySelector('header').insertBefore(plantsButton,document.querySelector('#beds-close'));plantsButton.onclick=()=>svg.setAttribute('viewBox','100 75 235 205');
const [catalog,stages]=await Promise.all(['./assets/current-v205/catalog.json?v=269','./assets/plants-hd-v118/catalog.json'].map(src=>fetch(src).then(r=>r.json())));catalog.apple=stages.apple[5];
const defs=make('defs'),pattern=make('pattern',{id:'qa-bed',patternUnits:'userSpaceOnUse',width:24,height:12});pattern.append(make('image',{href:'./assets/surfaces/bed-221.webp',width:24,height:12,preserveAspectRatio:'none'}));defs.append(pattern);svg.append(defs);const beds=make('g'),bedTurf=new PaintedTurfEdge();svg.append(beds,bedTurf.node);
const original=[{id:'check-tree',type:'apple',column:2,row:8,rotation:0},{id:'check-bush',type:'black_currant',column:4,row:10,rotation:0},{id:'check-house',type:'house',column:3,row:1,rotation:0},...[4,5,6,7,8,9].map(c=>({id:'check-bridge-'+c,type:'bridges_2',column:c,row:4,rotation:0})),...[3,4,5].map(c=>({id:'check-fence-'+c,type:'lugansk-fence',column:c,row:8,rotation:0}))];let objects=original.map(o=>({...o})),grassBank=true;const groups=new Map();
function draw(){const cells=landCells(0);for(let c=6;c<=9;c++)for(let r=4;r<=7;r++)cells[cellIndex(c,r)]='water';for(let c=5;c<=10;c++)for(let r=3;r<=8;r++)if(c===5||c===10||r===3||r===8)cells[cellIndex(c,r)]='path';if(grassBank)for(let c=6;c<=9;c++)cells[cellIndex(c,8)]='grass';for(let c=1;c<=3;c++)for(let r=4;r<=5;r++)cells[cellIndex(c,r)]='bed';renderer.update(cells,objects);renderer.setView({scale:2});beds.replaceChildren(...cells.flatMap((v,i)=>v==='bed'?[make('path',{d:roundedBed(cellColumn(i),cellRow(i)),fill:'url(#qa-bed)'}),...bedEdgeNodes(roundedBed(cellColumn(i),cellRow(i)))]:[]));
 bedTurf.update(bedCoverage(cells),{front:true,soil:false});
 const ids=new Set(objects.map(o=>o.id));for(const [id,g]of groups)if(!ids.has(id)){removeGrounding(g);g.remove();groups.delete(id)}
 for(const {o,box}of objects.map(o=>({o,box:spriteBox(o,catalog[o.type])})).sort((a,b)=>a.box.pivotY-b.box.pivotY)){let g=groups.get(o.id);if(!g){g=make('g',{'data-decor-id':o.id});g.append(make('image'));groups.set(o.id,g)}svg.append(g);const image=g.firstElementChild,frame=catalog[o.type][o.rotation];image.setAttribute('href',frame.bridgeVariants?.[bridgeJoins(objects).get(o.id)||0]||frame.src);for(const k of ['x','y','width','height'])image.setAttribute(k,box[k]);image.setAttribute('transform',spriteTransform(box,frame));updateGrounding(svg,g,o,image,box,cells,frame)}status.textContent='Игровые материалы и предметы';}
document.querySelector('#beds-close').onclick=()=>svg.setAttribute('viewBox','210 62 220 130');document.querySelector('#bank-close').onclick=()=>svg.setAttribute('viewBox','306 154 280 152');document.querySelector('#overview').onclick=()=>svg.setAttribute('viewBox','120 0 540 370');
document.querySelector('#bank').onclick=e=>{grassBank=!grassBank;e.target.textContent=grassBank?'Дорожка у воды':'Газон у воды';draw()};
document.querySelector('#rotate-built').onclick=()=>{for(const o of objects)if(o.type==='house'||o.type==='bridges_2')o.rotation=(o.rotation+1)%4;draw()};
document.querySelector('#rotate').onclick=()=>{const tree=objects.find(o=>o.id==='check-tree');tree.rotation=(tree.rotation+1)%4;draw()};document.querySelector('#move').onclick=()=>{const tree=objects.find(o=>o.id==='check-tree');tree.column=tree.column===3?2:3;draw()};document.querySelector('#remove').onclick=()=>{objects=objects.filter(o=>o.id!=='check-bush');draw()};document.querySelector('#reset').onclick=()=>{objects=original.map(o=>({...o}));draw()};draw();
</script></html>
